<title>מתכננים חתונה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: mobile-first single column (max 720px), tab views switched by a fixed bottom bar, edits in bottom sheets */
:root {
  --bg: #FBF8FA; --surface: #FFFFFF; --fg: #2B2130; --muted: #76687A;
  --accent: #8C2F55; --accent-fg: #FFFFFF; --accent-soft: #F4E4EB; --line: #ECE1E8;
  --ok: #2F7A5B; --ok-soft: #E2F2EA; --warn: #A86A12; --warn-soft: #FBEFD9; --bad: #B4413C; --bad-soft: #F8E2E0;
  --display: "Frank Ruhl Libre", "David", Georgia, serif;
  --body: "Assistant", "Segoe UI", Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17121A; --surface: #221A26; --fg: #F3EAF1; --muted: #B1A1B5;
  --accent: #E58AAE; --accent-fg: #2A1420; --accent-soft: #3A2332; --line: #35293B;
  --ok: #6CC59D; --ok-soft: #1E3329; --warn: #E3B15C; --warn-soft: #3A2E18; --bad: #E4807A; --bad-soft: #3D2120;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #17121A; --surface: #221A26; --fg: #F3EAF1; --muted: #B1A1B5;
  --accent: #E58AAE; --accent-fg: #2A1420; --accent-soft: #3A2332; --line: #35293B;
  --ok: #6CC59D; --ok-soft: #1E3329; --warn: #E3B15C; --warn-soft: #3A2E18; --bad: #E4807A; --bad-soft: #3D2120;
  color-scheme: dark; }

body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.5; }
#app { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; text-wrap: balance; margin: 0; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.15rem; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px 12px; }
.brand { font-family: var(--display); font-size: 1.15rem; font-weight: 700; color: var(--accent); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: .9rem; }

.banner { border-radius: var(--r); padding: 10px 14px; font-size: .9rem; margin-bottom: 12px; background: var(--warn-soft); color: var(--fg); }
.banner[hidden] { display: none !important; }

.view { display: flex; flex-direction: column; gap: 16px; }
.viewhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.btn { border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 700; background: var(--accent); color: var(--accent-fg); }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.sm { padding: 6px 14px; font-size: .9rem; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }

/* Hero countdown */
.hero { text-align: center; padding-block: 20px 8px; }
.hero .names { font-family: var(--display); font-size: 1.9rem; }
.hero .days { font-family: var(--display); font-size: 4.5rem; line-height: 1; color: var(--accent); margin-top: 10px; }
.hero .dayslabel { font-weight: 600; }
.hero .date { margin-top: 6px; color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-width: 0; }
.stat .label { font-size: .8rem; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.stat .value { font-size: 1.35rem; font-weight: 700; margin-top: 2px; }
.stat .sub { font-size: .8rem; color: var(--muted); }
.bar { height: 6px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; margin-top: 8px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.over > i { background: var(--bad); }

.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; }
.row .main { flex: 1; min-width: 0; }
.row .title { font-weight: 600; overflow-wrap: anywhere; }
.row .meta { font-size: .85rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.row.clickable { cursor: pointer; }
.row.done .title { text-decoration: line-through; color: var(--muted); }

.check { width: 26px; height: 26px; flex: none; border-radius: 8px; border: 2px solid var(--accent); background: transparent; display: grid; place-items: center; padding: 0; color: var(--accent-fg); }
.check.on { background: var(--accent); }
.check svg { width: 16px; height: 16px; }

.pill { display: inline-block; border-radius: 999px; padding: 1px 10px; font-size: .8rem; font-weight: 700; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.plain { background: transparent; border: 1px solid var(--line); color: var(--muted); }

.group { display: flex; flex-direction: column; gap: 4px; }
.grouphead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.grouphead h3 { font-size: 1.05rem; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: .9rem; font-weight: 600; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.search { width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 16px; }

.rsvp { display: flex; gap: 4px; flex: none; }
.rsvp button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; padding: 0; }
.rsvp button.on.yes { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.rsvp button.on.no { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.rsvp button.on.maybe { background: var(--warn); color: var(--surface); border-color: var(--warn); }
.wa { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--ok-soft); color: var(--ok); text-decoration: none; }
.wa svg { width: 18px; height: 18px; }

.empty { text-align: center; padding: 28px 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty p { margin: 0; max-width: 34ch; }

.money { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-size: .85rem; }
.money b { display: block; font-size: 1rem; }

/* Bottom nav */
.nav { position: fixed; inset: auto 0 0 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); z-index: 20; }
.nav .inner { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button { border: 0; background: none; padding: 8px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .75rem; font-weight: 600; color: var(--muted); }
.nav button svg { width: 22px; height: 22px; }
.nav button.on { color: var(--accent); }

/* Bottom sheet */
.scrim { position: fixed; inset: 0; background: rgba(20, 10, 18, .45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 720px; max-height: 88vh; overflow-y: auto; border-radius: 20px 20px 0 0; box-sizing: border-box; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet form { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: .85rem; font-weight: 700; color: var(--muted); }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; width: 100%; box-sizing: border-box; }
.field textarea { min-height: 120px; resize: vertical; }
.fields2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sheet .actions { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; margin-top: 6px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; z-index: 60; max-width: calc(100% - 32px); text-align: center; }

@media (max-width: 420px) { .hero .days { font-size: 3.8rem; } .stat .value { font-size: 1.15rem; } }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>

<div id="app" dir="rtl" lang="he">
  <div class="topbar">
    <span class="brand">מתכננים חתונה</span>
    <button class="iconbtn" data-act="settings" type="button">הגדרות</button>
  </div>
  <div class="banner" id="banner" hidden></div>
  <main id="view" class="view">
    <div class="card empty"><p>טוען את תוכנית החתונה…</p></div>
  </main>
</div>

<nav class="nav" dir="rtl" aria-label="ניווט ראשי"><div class="inner" id="nav"></div></nav>
<div id="sheetRoot" dir="rtl" lang="he"></div>
<div id="toastRoot" dir="rtl"></div>

<script>
(function () {
  "use strict";

  /* ---------- Constants ---------- */
  const PERIODS = [
    ["p3m", "3 חודשים לפני"],
    ["p2m", "חודשיים לפני"],
    ["p1m", "חודש לפני"],
    ["p2w", "שבועיים לפני"],
    ["p1w", "שבוע לפני"],
    ["day", "ביום החתונה"],
    ["after", "אחרי החתונה"]
  ];
  const PERIOD_LABEL = Object.fromEntries(PERIODS);

  const TASK_TEMPLATE = {
    p3m: ["לסגור אולם / גן אירועים", "צלם סטילס ווידאו", "DJ או להקה", "רב / עורך טקס", "פתיחת תיק ברבנות", "שמלת כלה – מדידות", "חליפת חתן", "מאפרת ומעצבת שיער", "עיצוב ופרחים", "טבעות נישואין", "רשימת מוזמנים ראשונית", "עיצוב והדפסת הזמנות"],
    p2m: ["שליחת הזמנות", "הדרכת כלות / הדרכת חתנים", "ניסיון איפור ושיער", "בחירת שירים לכניסה לחופה ולשבירת הכוס", "הסעות לאורחים", "הזמנת ירח דבש", "תיאום לוקיישן לצילומי זוגיות"],
    p1m: ["אישורי הגעה מהאורחים", "מדידה אחרונה לשמלה", "נעליים ואקססוריז", "בחירת עדים לכתובה", "טיוטת סידורי הושבה", "השלמת מקדמות לספקים"],
    p2w: ["מספר מנות סופי לאולם", "סידורי הושבה סופיים", "לו\"ז יום החתונה לכל הספקים", "הכנת מעטפות תשלום לספקים", "שיחת תיאום אחרונה עם כל ספק", "טבילה במקווה"],
    p1w: ["איסוף שמלה וחליפה", "תיק חירום ליום החתונה", "מניקור ופדיקור", "כתיבת ברכה / נאום", "אישור הגעה סופי מכל הספקים"],
    day: ["ארוחת בוקר טובה ושתייה", "למסור טבעות לעד", "למנות אחראי/ת על המתנות", "ליהנות!"],
    after: ["ספירת מתנות ורישום", "תשלום יתרות לספקים", "הודעות תודה לאורחים", "ביקורות לספקים", "החזרת פריטים מושכרים"]
  };

  const BUDGET_TEMPLATE = [
    ["אולם וקייטרינג", 45], ["צילום ווידאו", 10], ["מוזיקה / DJ", 7], ["שמלה וחליפה", 7],
    ["איפור ושיער", 3], ["עיצוב ופרחים", 6], ["הזמנות", 1], ["טבעות", 5],
    ["רב ורבנות", 2], ["הסעות", 2], ["ירח דבש", 8], ["שונות", 4]
  ];

  const VENDOR_STATUS = [["checking", "בבירור", "warn"], ["booked", "הוזמן", "ok"], ["rejected", "לא נבחר", "plain"]];
  const VS = Object.fromEntries(VENDOR_STATUS.map(([k, l, c]) => [k, { l, c }]));
  const GUEST_STATUS = { pending: "טרם ענו", yes: "מגיעים", no: "לא מגיעים", maybe: "אולי" };
  const SIDES = ["צד כלה", "צד חתן", "משותף"];

  const ICONS = {
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
    tasks: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>',
    budget: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>',
    vendors: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16l-1 12H5L4 7z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg>',
    guests: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.8-3.2 3.2-5 6-5s5.2 1.8 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14c2.4.2 4.2 1.8 5 4.5"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    wa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/><path d="M9.2 9.3c.3 2 2.5 4.6 5.4 5.4l1-1.2-1.6-.9-.8.6c-1-.5-1.8-1.3-2.4-2.4l.6-.8-.9-1.6z"/></svg>'
  };
  const TABS = [["home", "בית"], ["tasks", "משימות"], ["budget", "תקציב"], ["vendors", "ספקים"], ["guests", "אורחים"]];

  /* ---------- State ---------- */
  const COLS = ["tasks", "vendors", "guests", "budget"];
  const S = { settings: {}, tasks: [], vendors: [], guests: [], budget: [] };
  let db = null, readOnly = false, loaded = false;
  let tab = "home";
  const ui = { taskFilter: "open", vendorCat: "all", guestSide: "all", guestStatus: "all", guestQ: "" };
  try { const t = localStorage.getItem("wed-tab"); if (t && TABS.some(x => x[0] === t)) tab = t; } catch (e) {}

  const LOCAL_KEY = "wed-local-v1";
  function loadLocal() {
    try { const d = JSON.parse(localStorage.getItem(LOCAL_KEY) || "null"); if (d) Object.assign(S, d); } catch (e) {}
  }
  function saveLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(S)); } catch (e) {} }

  /* ---------- Helpers ---------- */
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const n = v => { const x = Number(String(v == null ? "" : v).replace(/[^\d.\-]/g, "")); return isFinite(x) ? x : 0; };
  const ils = v => "₪" + Math.round(n(v)).toLocaleString("he-IL");
  const pct = (a, b) => b > 0 ? Math.min(100, Math.round(a / b * 100)) : 0;
  function fmtDate(iso, opts) {
    if (!iso) return "";
    const d = new Date(iso + "T12:00:00");
    if (isNaN(d)) return "";
    return d.toLocaleDateString("he-IL", opts || { day: "numeric", month: "long", year: "numeric" });
  }
  function hebDate(iso) {
    try { return new Date(iso + "T12:00:00").toLocaleDateString("he-IL-u-ca-hebrew", { day: "numeric", month: "long", year: "numeric" }); } catch (e) { return ""; }
  }
  function daysUntil(iso) {
    if (!iso) return null;
    const d = new Date(iso + "T00:00:00"), t = new Date(); t.setHours(0, 0, 0, 0);
    return Math.round((d - t) / 86400000);
  }
  function waPhone(p) {
    let d = String(p || "").replace(/\D/g, "");
    if (!d) return "";
    if (d.startsWith("00")) d = d.slice(2);
    if (d.startsWith("0")) d = "972" + d.slice(1);
    return d;
  }
  function toast(msg) {
    const root = $("#toastRoot");
    root.innerHTML = '<div class="toast" role="status">' + esc(msg) + "</div>";
    clearTimeout(toast.t); toast.t = setTimeout(() => { root.innerHTML = ""; }, 2600);
  }
  function banner(msg) { const b = $("#banner"); b.textContent = msg || ""; b.hidden = !msg; }

  /* ---------- Persistence ---------- */
  async function saveDoc(col, id, data) {
    if (readOnly) { toast("אין לך הרשאת עריכה באתר הזה"); return false; }
    const clean = Object.assign({}, data); delete clean.id;
    if (!db) {
      if (col === "settings") S.settings = clean;
      else { const i = S[col].findIndex(x => x.id === id); const rec = Object.assign({ id }, clean); if (i >= 0) S[col][i] = rec; else S[col].push(rec); }
      saveLocal(); render(); return true;
    }
    try {
      await (col === "settings" ? db.doc("settings/main") : db.collection(col).doc(id)).set(clean);
      return true;
    } catch (e) { writeError(e); return false; }
  }
  async function deleteDoc(col, id) {
    if (readOnly) { toast("אין לך הרשאת עריכה באתר הזה"); return; }
    if (!db) { S[col] = S[col].filter(x => x.id !== id); saveLocal(); render(); return; }
    try { await db.collection(col).doc(id).delete(); } catch (e) { writeError(e); }
  }
  function writeError(e) {
    const code = e && e.code;
    if (code === "invalid_argument") { readOnly = true; toast("אין לך הרשאת עריכה. בקשי מבעלת האתר לשתף אותך כעורכ/ת."); render(); }
    else if (code === "quota_exceeded") toast("המקום במאגר הנתונים התמלא. מחקי פריטים ישנים ונסי שוב.");
    else toast("השמירה לא הצליחה. בדקי את החיבור ונסי שוב.");
  }
  async function saveMany(col, items, onProgress) {
    for (let i = 0; i < items.length; i += 10) {
      const chunk = items.slice(i, i + 10);
      const res = await Promise.all(chunk.map(it => saveDoc(col, it.id, it)));
      if (res.includes(false)) return false;
      if (onProgress) onProgress(Math.min(items.length, i + 10), items.length);
    }
    return true;
  }

  async function connect() {
    let user = null;
    try {
      if (window.claude && window.claude.use) {
        [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      }
    } catch (e) { db = null; }
    if (!db) {
      loadLocal(); loaded = true;
      banner("מצב תצוגה מקדימה: הנתונים נשמרים רק בדפדפן הזה. כדי לשתף, פתחי את האתר מהקישור שלו ב-Claude.");
      render(); return;
    }
    try { if (user && user.can && (await user.can("data.write")) === false) readOnly = true; } catch (e) {}
    if (readOnly) banner("יש לך הרשאת צפייה בלבד. כדי לערוך, בקשי מבעלת האתר לשתף אותך כעורכ/ת.");

    let pending = new Set(COLS.concat(["settings"]));
    const timer = setTimeout(() => { if (pending.size) banner("לא מצליחים להתחבר לנתונים כרגע. ייתכן שמה שמוצג לא מעודכן."); }, 10000);
    const settle = (k, fromCache) => {
      if (!fromCache) pending.delete(k);
      if (!pending.size) { clearTimeout(timer); if (!readOnly) banner(""); }
      loaded = true; render();
    };
    const onErr = e => { clearTimeout(timer); if (e && e.code === "revoked") banner("הגישה לאתר הופסקה."); else banner("החיבור לנתונים נקטע. רעננו את הדף."); };
    db.doc("settings/main").onSnapshot(s => { S.settings = s.exists ? Object.assign({}, s.data()) : {}; settle("settings", s.metadata.fromCache); }, onErr);
    COLS.forEach(c => db.collection(c).onSnapshot(s => { S[c] = s.docs.map(d => Object.assign({ id: d.id }, d.data())); settle(c, s.metadata.fromCache); }, onErr));
  }

  /* ---------- Derived ---------- */
  function vendorTotals(list) {
    let committed = 0, paid = 0;
    list.forEach(v => { if (v.status === "booked") { committed += n(v.price); paid += n(v.paid); } });
    return { committed, paid, left: committed - paid };
  }
  function guestTotals(list) {
    const t = { invited: 0, yes: 0, no: 0, maybe: 0, pending: 0, gifts: 0, households: list.length };
    list.forEach(g => {
      const c = Math.max(1, n(g.count) || 1); t.invited += c;
      const st = g.status || "pending";
      if (st === "yes") t.yes += n(g.arriving) || c; else t[st] += c;
      t.gifts += n(g.gift);
    });
    return t;
  }

  /* ---------- Render ---------- */
  function renderNav() {
    $("#nav").innerHTML = TABS.map(([k, l]) =>
      '<button type="button" data-act="tab" data-tab="' + k + '" class="' + (tab === k ? "on" : "") + '"' + (tab === k ? ' aria-current="page"' : "") + ">" + ICONS[k] + "<span>" + l + "</span></button>").join("");
  }

  function render() {
    renderNav();
    if (!loaded) return;
    const v = $("#view");
    v.innerHTML = ({ home: viewHome, tasks: viewTasks, budget: viewBudget, vendors: viewVendors, guests: viewGuests })[tab]();
  }

  function viewHome() {
    const st = S.settings, d = daysUntil(st.date);
    let hero;
    if (st.date) {
      const label = d > 1 ? "ימים לחתונה" : d === 1 ? "מחר החתונה!" : d === 0 ? "היום החתונה! מזל טוב" : "ימים מאז החתונה";
      hero = '<section class="hero"><div class="names">' + esc(st.names || "החתונה שלנו") + '</div>' +
        (d > 1 || d < 0 ? '<div class="days num">' + Math.abs(d) + "</div>" : "") +
        '<div class="dayslabel">' + label + '</div><div class="date">' + esc(fmtDate(st.date, { weekday: "long", day: "numeric", month: "long", year: "numeric" })) +
        " · " + esc(hebDate(st.date)) + (st.venue ? " · " + esc(st.venue) : "") + "</div></section>";
    } else {
      hero = '<section class="card empty"><h2>ברוכים הבאים 💍</h2><p>כדי להתחיל, הזינו את השמות, תאריך החתונה והתקציב.</p><button class="btn" data-act="settings" type="button">הגדרת פרטי החתונה</button></section>';
    }
    const tDone = S.tasks.filter(t => t.done).length, tAll = S.tasks.length;
    const vt = vendorTotals(S.vendors), total = n(st.budget);
    const gt = guestTotals(S.guests);
    const stats = '<div class="stats">' +
      '<div class="stat"><div class="label">משימות</div><div class="value num">' + tDone + "/" + tAll + '</div><div class="bar"><i style="width:' + pct(tDone, tAll) + '%"></i></div></div>' +
      '<div class="stat"><div class="label">תקציב</div><div class="value num">' + ils(vt.committed) + '</div><div class="sub">' + (total ? "מתוך " + ils(total) : "לא הוגדר") + '</div><div class="bar' + (total && vt.committed > total ? " over" : "") + '"><i style="width:' + pct(vt.committed, total) + '%"></i></div></div>' +
      '<div class="stat"><div class="label">אישרו הגעה</div><div class="value num">' + gt.yes + '</div><div class="sub">מתוך ' + gt.invited + ' מוזמנים</div><div class="bar"><i style="width:' + pct(gt.yes, gt.invited) + '%"></i></div></div>' +
      "</div>";

    const order = PERIODS.map(p => p[0]);
    const next = S.tasks.filter(t => !t.done).sort((a, b) => (order.indexOf(a.period) - order.indexOf(b.period)) || String(a.due || "9").localeCompare(String(b.due || "9"))).slice(0, 5);
    const nextHtml = '<section class="card"><div class="grouphead"><h3>המשימות הבאות</h3><button class="btn ghost sm" data-act="tab" data-tab="tasks" type="button">לכל המשימות</button></div><div class="list">' +
      (next.length ? next.map(taskRow).join("") : '<p class="muted">' + (tAll ? "כל המשימות הושלמו! 🎉" : "עוד אין משימות. בעמוד המשימות אפשר לטעון צ'קליסט מומלץ.") + "</p>") + "</div></section>";

    const pays = S.vendors.filter(v => v.status === "booked" && n(v.price) - n(v.paid) > 0)
      .sort((a, b) => String(a.payDate || "9").localeCompare(String(b.payDate || "9"))).slice(0, 5);
    const payHtml = '<section class="card"><div class="grouphead"><h3>תשלומים פתוחים לספקים</h3><span class="muted small num">יתרה: ' + ils(vt.left) + '</span></div><div class="list">' +
      (pays.length ? pays.map(v => '<div class="row clickable" data-act="edit-vendor" data-id="' + esc(v.id) + '"><div class="main"><div class="title">' + esc(v.name) + '</div><div class="meta"><span>' + esc(v.category || "") + "</span>" + (v.payDate ? "<span>לתשלום עד " + esc(fmtDate(v.payDate, { day: "numeric", month: "short" })) + "</span>" : "") + '</div></div><span class="num"><b>' + ils(n(v.price) - n(v.paid)) + "</b></span></div>").join("")
        : '<p class="muted">אין תשלומים פתוחים לספקים שהוזמנו.</p>') + "</div></section>";
    let rsvpHtml = "";
    if (S.guests.length) {
      const rd = reminderDays(), inWindow = d != null && d > 0 && d <= rd;
      const remDate = st.date ? new Date(new Date(st.date + "T12:00:00").getTime() - rd * 86400000).toISOString().slice(0, 10) : "";
      const lines = [
        ["invite", "לא קיבלו הזמנה עדיין", ""],
        ["nudge", "קיבלו הזמנה ולא ענו", ""],
        ["reminder", "אישרו, ממתינים לתזכורת", remDate ? (inWindow ? "הגיע הזמן לשלוח!" : "לשלוח ב-" + fmtDate(remDate, { day: "numeric", month: "long" })) : ""]
      ].map(([k, l, note]) => { const c = sendList(k).length; return '<div class="row"><div class="main"><div class="title"><span class="num">' + c + "</span> " + l + "</div>" + (note ? '<div class="meta"><span class="pill ' + (inWindow ? "warn" : "plain") + '">' + note + "</span></div>" : "") + "</div>" + (c ? '<button class="btn ' + (k === "reminder" && !inWindow ? "ghost " : "") + 'sm" data-act="send-open" data-v="' + k + '" type="button">שליחה</button>' : "") + "</div>"; }).join("");
      rsvpHtml = '<section class="card"><div class="grouphead"><h3>אישורי הגעה בוואטסאפ</h3></div><div class="list">' + lines + "</div></section>";
    }
    return hero + stats + rsvpHtml + nextHtml + payHtml;
  }

  function taskRow(t) {
    return '<div class="row' + (t.done ? " done" : "") + '"><button type="button" class="check' + (t.done ? " on" : "") + '" data-act="toggle-task" data-id="' + esc(t.id) + '" aria-label="' + (t.done ? "סמני כלא בוצע" : "סמני כבוצע") + '">' + (t.done ? ICONS.check : "") + "</button>" +
      '<div class="main clickable" data-act="edit-task" data-id="' + esc(t.id) + '"><div class="title">' + esc(t.title) + '</div><div class="meta">' +
      (t.owner ? '<span class="pill">' + esc(t.owner) + "</span>" : "") + (t.due ? "<span>עד " + esc(fmtDate(t.due, { day: "numeric", month: "short" })) + "</span>" : "") + (t.notes ? "<span>" + esc(t.notes.slice(0, 40)) + "</span>" : "") +
      "</div></div></div>";
  }

  function viewTasks() {
    const f = ui.taskFilter;
    const all = S.tasks;
    const head = '<div class="viewhead"><div><h2>משימות</h2><div class="muted small num">' + all.filter(t => t.done).length + " מתוך " + all.length + ' הושלמו</div></div><button class="btn" data-act="add-task" type="button">+ משימה</button></div>';
    if (!all.length) return head + '<section class="card empty"><p>אפשר להתחיל מצ\'קליסט מוכן של כ-45 משימות לפי לוח זמנים, ולערוך אותו בהמשך.</p><button class="btn" data-act="seed-tasks" type="button">טעינת צ\'קליסט מומלץ</button></section>';
    const owners = [...new Set(all.map(t => t.owner).filter(Boolean))];
    const chips = '<div class="chips">' + [["open", "פתוחות"], ["all", "הכל"], ["done", "הושלמו"]].concat(owners.map(o => ["o:" + o, o])).map(([k, l]) =>
      '<button type="button" class="chip' + (f === k ? " on" : "") + '" data-act="task-filter" data-f="' + esc(k) + '">' + esc(l) + "</button>").join("") + "</div>";
    const list = all.filter(t => f === "all" ? true : f === "open" ? !t.done : f === "done" ? t.done : t.owner === f.slice(2));
    const groups = PERIODS.map(([k, l]) => {
      const items = list.filter(t => (t.period || "p3m") === k).sort((a, b) => String(a.due || "9").localeCompare(String(b.due || "9")));
      if (!items.length) return "";
      const tot = all.filter(t => (t.period || "p3m") === k), dn = tot.filter(t => t.done).length;
      return '<section class="card group"><div class="grouphead"><h3>' + l + '</h3><span class="muted small num">' + dn + "/" + tot.length + '</span></div><div class="list">' + items.map(taskRow).join("") + "</div></section>";
    }).join("");
    return head + chips + (groups || '<p class="muted">אין משימות שמתאימות לסינון הזה.</p>');
  }

  function viewBudget() {
    const total = n(S.settings.budget), vt = vendorTotals(S.vendors);
    const planned = S.budget.reduce((s, b) => s + n(b.planned), 0);
    const head = '<div class="viewhead"><div><h2>תקציב</h2><div class="muted small">ההוצאות בפועל מחושבות מהספקים שסומנו כ"הוזמן"</div></div><button class="btn" data-act="add-budget" type="button">+ קטגוריה</button></div>';
    const sum = '<section class="card"><div class="money num"><div><span class="muted">תקציב כולל</span><b>' + (total ? ils(total) : "—") + '</b></div><div><span class="muted">התחייבנו</span><b>' + ils(vt.committed) + '</b></div><div><span class="muted">שולם</span><b>' + ils(vt.paid) + '</b></div></div>' +
      '<div class="bar' + (total && vt.committed > total ? " over" : "") + '"><i style="width:' + pct(vt.committed, total) + '%"></i></div>' +
      '<div class="small muted" style="margin-top:8px">' + (total ? (total - vt.committed >= 0 ? "נשארו " + ils(total - vt.committed) + " לא מוקצים" : "חריגה של " + ils(vt.committed - total) + " מהתקציב") : '<button class="btn ghost sm" data-act="settings" type="button">הגדרת תקציב כולל</button>') +
      (planned && total && planned !== total ? " · סכום הקטגוריות: " + ils(planned) : "") + "</div></section>";
    if (!S.budget.length) return head + sum + '<section class="card empty"><p>אפשר לטעון קטגוריות נפוצות לחתונה בישראל, עם חלוקה מומלצת של התקציב הכולל.</p><button class="btn" data-act="seed-budget" type="button">טעינת קטגוריות מומלצות</button></section>';
    const rows = S.budget.slice().sort((a, b) => n(b.planned) - n(a.planned)).map(b => {
      const vs = S.vendors.filter(v => v.category === b.name), t = vendorTotals(vs), p = n(b.planned);
      const over = p && t.committed > p;
      return '<div class="row clickable" data-act="edit-budget" data-id="' + esc(b.id) + '"><div class="main"><div class="grouphead"><span class="title">' + esc(b.name) + '</span><span class="num small' + (over ? '" style="color:var(--bad)' : "") + '"><b>' + ils(t.committed) + '</b> <span class="muted">/ ' + (p ? ils(p) : "—") + "</span></span></div>" +
        '<div class="bar' + (over ? " over" : "") + '"><i style="width:' + pct(t.committed, p) + '%"></i></div>' +
        '<div class="meta"><span>' + (vs.length ? vs.length + " ספקים" : "אין ספקים") + "</span>" + (t.committed ? "<span>שולם " + ils(t.paid) + "</span>" : "") + (over ? '<span class="pill bad">חריגה</span>' : "") + "</div></div></div>";
    }).join("");
    return head + sum + '<section class="card"><div class="list">' + rows + "</div></section>";
  }

  function vendorCats() {
    const s = new Set(S.budget.map(b => b.name));
    S.vendors.forEach(v => v.category && s.add(v.category));
    if (!s.size) BUDGET_TEMPLATE.forEach(b => s.add(b[0]));
    return [...s];
  }

  function viewVendors() {
    const head = '<div class="viewhead"><div><h2>ספקים</h2><div class="muted small">' + S.vendors.filter(v => v.status === "booked").length + " הוזמנו · " + S.vendors.filter(v => v.status === "checking").length + ' בבירור</div></div><button class="btn" data-act="add-vendor" type="button">+ ספק</button></div>';
    if (!S.vendors.length) return head + '<section class="card empty"><p>הוסיפו ספקים שסגרתם או שאתם בודקים. אם יש כמה הצעות לאותה קטגוריה, הן יוצגו זו ליד זו כדי שיהיה קל להשוות.</p><button class="btn" data-act="add-vendor" type="button">הוספת ספק ראשון</button></section>';
    const cats = [...new Set(S.vendors.map(v => v.category || "שונות"))];
    const chips = '<div class="chips">' + [["all", "הכל"]].concat(cats.map(c => [c, c])).map(([k, l]) => '<button type="button" class="chip' + (ui.vendorCat === k ? " on" : "") + '" data-act="vendor-cat" data-c="' + esc(k) + '">' + esc(l) + "</button>").join("") + "</div>";
    const sorder = { booked: 0, checking: 1, rejected: 2 };
    const groups = cats.filter(c => ui.vendorCat === "all" || ui.vendorCat === c).map(c => {
      const vs = S.vendors.filter(v => (v.category || "שונות") === c).sort((a, b) => (sorder[a.status] ?? 1) - (sorder[b.status] ?? 1));
      return '<section class="card group"><div class="grouphead"><h3>' + esc(c) + '</h3><span class="muted small">' + vs.length + '</span></div><div class="list">' + vs.map(vendorRow).join("") + "</div></section>";
    }).join("");
    return head + chips + groups;
  }
  function vendorRow(v) {
    const s = VS[v.status] || VS.checking, left = n(v.price) - n(v.paid);
    const pay = v.status === "booked" ? (n(v.price) && left <= 0 ? '<span class="pill ok">שולם במלואו</span>' : n(v.paid) ? '<span class="pill warn">יתרה ' + ils(left) + "</span>" : "") : "";
    return '<div class="row clickable" data-act="edit-vendor" data-id="' + esc(v.id) + '"><div class="main"><div class="grouphead"><span class="title">' + esc(v.name) + '</span><span class="pill ' + s.c + '">' + s.l + "</span></div>" +
      '<div class="meta">' + (n(v.price) ? '<span class="num">' + ils(v.price) + "</span>" : "") + pay + (v.contact ? "<span>" + esc(v.contact) + "</span>" : "") + (v.phone ? '<span class="num" dir="ltr">' + esc(v.phone) + "</span>" : "") + (v.payDate && left > 0 && v.status === "booked" ? "<span>תשלום עד " + esc(fmtDate(v.payDate, { day: "numeric", month: "short" })) + "</span>" : "") + "</div>" +
      (v.notes ? '<div class="small muted">' + esc(v.notes) + "</div>" : "") + "</div></div>";
  }

  const MSG = {
    invite: { label: "הזמנה ואישור הגעה", key: "rsvpMsg", flag: "sent_invite", done: "הזמנה נשלחה",
      def: "היי {שם}! 💍 אנחנו מתחתנים ושמחים להזמין אותך לחתונה של {זוג}{תאריך}{מקום}. נשמח שתאשרו הגעה וכמה תגיעו 💕",
      who: g => !g.sent_invite, desc: "כל מי שעוד לא קיבל הזמנה" },
    nudge: { label: "תזכורת למי שלא ענה", key: "nudgeMsg", flag: "sent_nudge", done: "תזכורת אישור נשלחה",
      def: "היי {שם}, רק מזכירים 😊 נשמח לדעת אם תגיעו לחתונה של {זוג}{תאריך} וכמה תהיו. תודה!",
      who: g => g.sent_invite && !g.sent_nudge && ["pending", "maybe"].includes(g.status || "pending"), desc: "קיבלו הזמנה ועדיין לא אישרו" },
    reminder: { label: "תזכורת לפני החתונה", key: "reminderMsg", flag: "sent_reminder", done: "תזכורת נשלחה",
      def: "היי {שם}! 🎉 עוד {ימים} ימים אנחנו מתחתנים ומחכים לראות אותך{תאריך}{מקום}. ניווט בוויז: {ניווט}",
      who: g => g.status === "yes" && !g.sent_reminder, desc: "כל מי שאישר הגעה" }
  };
  const sendList = type => S.guests.filter(g => waPhone(g.phone) && MSG[type].who(g)).sort((a, b) => String(a.name).localeCompare(String(b.name), "he"));
  const reminderDays = () => n(S.settings.reminderDays) || 3;
  function rsvpText(g, type) {
    const st = S.settings, m = MSG[type || "invite"];
    const tpl = st[m.key] || m.def, d = daysUntil(st.date);
    return tpl.replace(/\{שם\}/g, g.name || "").replace(/\{זוג\}/g, st.names || "").replace(/\{תאריך\}/g, st.date ? " ב-" + fmtDate(st.date, { weekday: "long", day: "numeric", month: "long" }) : "")
      .replace(/\{מקום\}/g, st.venue ? " ב" + st.venue : "").replace(/\{ימים\}/g, d != null && d > 0 ? d : "כמה")
      .replace(/\{ניווט\}/g, st.venue ? "https://waze.com/ul?q=" + encodeURIComponent(st.venue) + "&navigate=yes" : "");
  }
  const waLink = (g, type) => "https://wa.me/" + waPhone(g.phone) + "?text=" + encodeURIComponent(rsvpText(g, type));
  function sentPill(g) {
    const t = g.sent_reminder ? "reminder" : g.sent_nudge ? "nudge" : g.sent_invite ? "invite" : "";
    return t ? '<span class="pill plain">' + MSG[t].done + "</span>" : "";
  }

  /* WhatsApp send queue: one tap per guest, then it advances to the next */
  let sendQ = null;
  function openSend(type) {
    if (readOnly) { toast("אין לך הרשאת עריכה באתר הזה"); return; }
    sendQ = { type, ids: sendList(type).map(g => g.id), i: 0, sent: 0 };
    renderSend();
  }
  function renderSend() {
    const q = sendQ, root = $("#sheetRoot");
    const chips = '<div class="chips">' + Object.keys(MSG).map(k => '<button type="button" class="chip' + (q.type === k ? " on" : "") + '" data-act="send-type" data-v="' + k + '">' + MSG[k].label + ' <span class="num">(' + sendList(k).length + ")</span></button>").join("") + "</div>";
    const g = q.ids[q.i] && find("guests", q.ids[q.i]);
    let body;
    if (!q.ids.length) body = '<div class="card empty"><p>אין כרגע אורחים עם טלפון ברשימה הזו (' + MSG[q.type].desc + ').</p></div>';
    else if (!g) body = '<div class="card empty"><h3>סיימת! 🎉</h3><p>נשלחו ' + q.sent + " הודעות. כשאורחים עונים לך בוואטסאפ, סמני להם ✓ / ✕ ברשימת האורחים.</p></div>";
    else body = '<div class="card"><div class="grouphead"><span class="muted small num">' + (q.i + 1) + " מתוך " + q.ids.length + '</span><span class="muted small">' + esc(MSG[q.type].desc) + "</span></div>" +

  const cellStr = v => String(v == null ? "" : v).trim();
  function normPhone(v) {
    let s = cellStr(v);
    const d = s.replace(/\D/g, "");
    if (d.length === 9 && d[0] === "5") return "0" + d;
    if (d.length === 12 && d.startsWith("972")) return "0" + d.slice(3);
    return s;
  }
  function detectColumns(rows) {
    const rules = [
      ["phone", /טלפון|נייד|פלאפון|סלולרי|phone|mobile|tel/i],
      ["count", /כמות|מספר|מס'|מס׳|מוזמנים|נפשות|כמה|count|qty|quantity|amount|guests|party|size|pax|people|seats|invited|#/i],
      ["side", /^צד|side|bride|groom/i],
      ["group", /קבוצה|קטגוריה|קרבה|קשר|סוג|group|relation|category|type|circle/i],
      ["last", /משפחה|last|surname/i],
      ["name", /שם|name|אורח|מוזמן|^guest$|^invitee$/i],
      ["notes", /הערות|הערה|notes|comment/i]
    ];
    for (let r = 0; r < Math.min(6, rows.length); r++) {
      const map = {};
      rows[r].forEach((h, i) => {
        const t = cellStr(h); if (!t || t.length > 30) return;
        const hit = rules.find(([k, re]) => re.test(t) && map[k] == null);
        if (hit) map[hit[0]] = i;
      });
      if (map.name == null && map.last != null) { map.name = map.last; delete map.last; }
      if (map.name != null) return { map, start: r + 1, header: true };
    }
    // No header row: guess from the data
    const sample = rows.slice(0, 20), cols = Math.max(0, ...sample.map(r => r.length));
    const map = {};
    for (let i = 0; i < cols; i++) {
      const vals = sample.map(r => cellStr(r[i])).filter(Boolean);
      if (!vals.length) continue;
      const digits = vals.map(v => v.replace(/\D/g, ""));
      if (map.phone == null && digits.filter(d => d.length >= 7).length >= vals.length * .6) map.phone = i;
      else if (map.count == null && vals.every(v => /^\d{1,2}$/.test(v))) map.count = i;
      else if (map.name == null && digits.filter(d => d.length === 0).length >= vals.length * .6) map.name = i;
    }
    if (map.name == null) map.name = 0;
    return { map, start: 0, header: false };
  }
  async function readExcel(file) {

    } catch (e) { toast("לא הצלחנו לקרוא את הקובץ. ודאי שזה קובץ אקסל או CSV."); return; }
    rows = (rows || []).filter(r => r.some(c => cellStr(c)));
    if (!rows.length) { toast("הקובץ ריק"); return; }
    const { map, start } = detectColumns(rows);
    const existing = new Set(S.guests.map(g => (g.name || "").trim() + "|" + waPhone(g.phone)));
    const seen = new Set();

    rows.slice(start).forEach(r => {

      if (!name) return;

      const key = name + "|" + waPhone(phone);
      if (existing.has(key) || seen.has(key)) { dup++; return; }
      seen.add(key);

      const side = /כלה|bride/i.test(sideRaw) ? "צד כלה" : /חתן|groom/i.test(sideRaw) ? "צד חתן" : /משות|both/i.test(sideRaw) ? "משותף" : "";
      guests.push({ id: uid(), name, phone, count: map.count != null ? Math.max(1, n(r[map.count]) || 1) : 1, side, group: map.group != null ? cellStr(r[map.group]) : "", notes: map.notes != null ? cellStr(r[map.notes]) : "", status: "pending", arriving: 0, gift: 0 });
    });
    if (!guests.length) { toast(dup ? "כל האורחים בקובץ כבר קיימים ברשימה" : "לא נמצאו שמות בקובץ"); return; }
    const labels = { name: "שם", last: "שם משפחה", phone: "טלפון", count: "כמות", side: "צד", group: "קבוצה", notes: "הערות" };
    const found = Object.keys(map).map(k => labels[k]).filter(Boolean);
    const missingSide = guests.some(g => !g.side), people = guests.reduce((s, g) => s + g.count, 0);
    const preview = guests.slice(0, 5).map(g => '<div class="row"><div class="main"><div class="title">' + esc(g.name) + ' <span class="muted small num">×' + g.count + '</span></div><div class="meta">' + (g.phone ? '<span class="num" dir="ltr">' + esc(g.phone) + "</span>" : "") + (g.side ? "<span>" + esc(g.side) + "</span>" : "") + (g.group ? "<span>" + esc(g.group) + "</span>" : "") + "</div></div></div>").join("");
    const html = '<div class="card"><div class="small"><b class="num">' + guests.length + " הזמנות (" + people + ' מוזמנים)</b> מהקובץ ' + esc(file.name) + "</div>" +
      '<div class="small muted">עמודות שזוהו: ' + esc(found.join(", ")) + (dup ? " · " + dup + " כפולים או קיימים ידולגו" : "") + "</div>" +
      '<div class="list" style="margin-top:6px">' + preview + "</div>" + (guests.length > 5 ? '<div class="small muted">ועוד ' + (guests.length - 5) + "…</div>" : "") + "</div>";
    const fields = [];
    if (missingSide) fields.push({ k: "side", label: "צד לאורחים שאין להם צד בקובץ", type: "select", options: SIDES });
    if (map.group == null) fields.push({ k: "group", label: "קבוצה (רשות)", list: ["משפחה", "חברים", "עבודה"] });
    openSheet({
      title: "ייבוא מוזמנים מאקסל", values: {}, html, fields,
      intro: "בדקי שהעמודות זוהו נכון. אם משהו לא מסתדר, אפשר לשנות את שורת הכותרות בקובץ (למשל: שם, טלפון, כמות, צד, קבוצה) ולהעלות שוב.",
      onSave: async d => {
        guests.forEach(g => { if (!g.side) g.side = d.side || SIDES[0]; if (!g.group && d.group) g.group = d.group; });
        const ok = await saveMany("guests", guests, (i, t) => toast("שומר " + i + " מתוך " + t + "…"));
        if (ok) toast("נוספו " + guests.length + " הזמנות 🎉");
        return ok;
      }
    });
  }

  function editSettings() {
    openSheet({
      title: "פרטי החתונה", values: S.settings,
      fields: [{ k: "names", label: "השמות שלכם", ph: "למשל: הדס & יונתן" }, [{ k: "date", label: "תאריך החתונה", type: "date" }, { k: "budget", label: "תקציב כולל (₪)", type: "number" }], { k: "venue", label: "מקום האירוע" },
        { k: "rsvpMsg", label: "הודעת הזמנה ואישור הגעה", type: "textarea", def: MSG.invite.def },
        { k: "nudgeMsg", label: "תזכורת למי שלא ענה", type: "textarea", def: MSG.nudge.def },
        { k: "reminderMsg", label: "תזכורת לפני החתונה (למי שאישר)", type: "textarea", def: MSG.reminder.def },
        { k: "reminderDays", label: "כמה ימים לפני החתונה לשלוח תזכורת", type: "number", def: "3" }],
      intro: "בנוסחי ההודעות אפשר להשתמש ב-{שם}, {זוג}, {תאריך}, {מקום}, {ימים} (ימים שנותרו) ו-{ניווט} (קישור לוויז), והם יוחלפו אוטומטית לכל אורח.",
      onSave: d => saveDoc("settings", "main", Object.assign({}, S.settings, d, { budget: n(d.budget), reminderDays: n(d.reminderDays) || 3 }))
    });
  }

  /* ---------- Events ---------- */
  const find = (col, id) => S[col].find(x => x.id === id);
  let busy = false;
  document.addEventListener("click", async e => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    if (act === "close-sheet") { if (e.target === el || el.tagName === "BUTTON") { closeSheet(); sendQ = null; } return; }
    if (el.closest(".sheet") && !/^send-|^settings$/.test(act)) return;
    switch (act) {
      case "send-open": openSend(el.dataset.v); break;
      case "send-type": openSend(el.dataset.v); break;
      case "send-skip": if (sendQ) { sendQ.i++; renderSend(); } break;
      case "send-go": {
        // let the link open WhatsApp, then mark as sent and advance
        const q = sendQ, g = q && find("guests", q.ids[q.i]); if (!g) break;
        const flag = MSG[q.type].flag;
        setTimeout(() => {
          saveDoc("guests", g.id, Object.assign({}, g, { [flag]: new Date().toISOString().slice(0, 10) }));
          if (sendQ === q) { q.i++; q.sent++; renderSend(); }
        }, 400);
        break;
      }
      case "wa-row": {
        const g = find("guests", id);
        if (g && !g.sent_invite) setTimeout(() => saveDoc("guests", id, Object.assign({}, g, { sent_invite: new Date().toISOString().slice(0, 10) })), 400);
        break;
      }
      case "tab": tab = el.dataset.tab; try { localStorage.setItem("wed-tab", tab); } catch (x) {} render(); window.scrollTo(0, 0); break;
      case "settings": editSettings(); break;
      case "add-task": editTask(); break;
      case "edit-task": editTask(find("tasks", id)); break;
      case "toggle-task": { const t = find("tasks", id); if (t) saveDoc("tasks", id, Object.assign({}, t, { done: !t.done })); break; }
      case "task-filter": ui.taskFilter = el.dataset.f; render(); break;
      case "seed-tasks": {
        if (busy) return; busy = true; el.disabled = true; el.textContent = "טוען…";
        const items = []; PERIODS.forEach(([k]) => (TASK_TEMPLATE[k] || []).forEach(title => items.push({ id: uid(), title, period: k, done: false, owner: "", due: "", notes: "" })));
        await saveMany("tasks", items); busy = false; break;
      }
      case "add-budget": editBudget(); break;
      case "edit-budget": editBudget(find("budget", id)); break;
      case "seed-budget": {
        if (busy) return; busy = true; el.disabled = true; el.textContent = "טוען…";
        const total = n(S.settings.budget);
        await saveMany("budget", BUDGET_TEMPLATE.map(([name, p]) => ({ id: uid(), name, planned: total ? Math.round(total * p / 100 / 100) * 100 : 0 })));
        busy = false; break;
      }
      case "add-vendor": editVendor(); break;
      case "edit-vendor": editVendor(find("vendors", id)); break;
      case "vendor-cat": ui.vendorCat = el.dataset.c; render(); break;
      case "add-guest": editGuest(); break;
      case "edit-guest": editGuest(find("guests", id)); break;
      case "bulk-guests": bulkGuests(); break;
      case "excel-guests": pickExcel(); break;
      case "guest-side": ui.guestSide = el.dataset.v; render(); break;
      case "guest-status-f": ui.guestStatus = el.dataset.v; render(); break;
      case "rsvp": {
        const g = find("guests", id); if (!g) break;
        const v = (g.status || "pending") === el.dataset.v ? "pending" : el.dataset.v;
        saveDoc("guests", id, Object.assign({}, g, { status: v, arriving: v === "yes" ? (n(g.arriving) || Math.max(1, n(g.count) || 1)) : 0 }));
        break;
      }
    }
  });
  let qTimer;
  document.addEventListener("input", e => {
    if (e.target.id !== "guestSearch") return;
    ui.guestQ = e.target.value;
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { const pos = e.target.selectionStart; render(); const s = $("#guestSearch"); if (s) { s.focus(); try { s.setSelectionRange(pos, pos); } catch (x) {} } }, 200);
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

  renderNav();
  connect();
})();
</script>
